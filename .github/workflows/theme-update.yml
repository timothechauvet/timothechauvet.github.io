name: "Theme Update"

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          ref: master

      # Setup mise
      - uses: jdx/mise-action@v3


      - name: Setup Dart Sass
        run: |
          V=1.108.2
          curl -sL https://github.com/sass/dart-sass/releases/download/$V/dart-sass-$V-linux-x64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          mise run install # install theme dependency

      - name: Update theme to latest commit
        run: |
          mise run update-to-main

      - name: Build
        run: |
          # build the site
          mise run build
          # remove file generated by the build
          rm -rf public/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          base: master
          title: Update theme
          labels: automerge